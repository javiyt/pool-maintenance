# Mergify configuration - auto-merge for javiyt's PRs after CI passes
pull_request_rules:
  - name: Automatic merge for javiyt's PRs after CI passes
    conditions:
      - "author=javiyt"
      - "status-success=*"
      - "base=<rama-por-defecto>"
      - "-conflict"
      - "-draft"
    actions:
      merge:
        method: squash   # o merge / rebase según el repo
        strict: true     # asegura que la PR esté actualizada antes de mergear
      delete_head_branch: {}
